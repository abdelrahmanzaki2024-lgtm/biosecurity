<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d1d1e"><title>وصّلني</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{
  --red:#EA2329;--red-d:#B81E25;--ink:#242424;--gray:#6D6E71;
  --bg:#F4F4F5;--card:#fff;--line:#E4E4E6;--soft:#F0F0F2;--txt:#242424;--mut:#6D6E71;
  --ok:#2E9E5B;--ok-bg:#E6F5EC;--warn:#C98200;--warn-bg:#FFF4D9;--bad-bg:#FDE8E9;
  --hdr:#242424;--shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --r:16px;--tab:64px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161617;--card:#212123;--line:#343437;--soft:#2A2A2D;--txt:#F2F2F3;--mut:#A3A4A8;--ok-bg:#16301F;--warn-bg:#3A2D0E;--bad-bg:#3A1618;--shadow:0 1px 2px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#161617;--card:#212123;--line:#343437;--soft:#2A2A2D;--txt:#F2F2F3;--mut:#A3A4A8;--ok-bg:#16301F;--warn-bg:#3A2D0E;--bad-bg:#3A1618;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#E9E9EB;color:var(--txt);font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:#0C0C0D}}
:root[data-theme="dark"] body{background:#0C0C0D}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-d);text-decoration:none}
img{max-width:100%;display:block}
#app_unused{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media (min-width:520px){#app_unused{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.18)}}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}svg.i.lg{width:28px;height:28px}

/* ---- header ---- */
.hdr{position:sticky;top:0;z-index:20;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.hdr .logo{height:34px;width:auto}
.hdr .ttl{flex:1;font-weight:800;font-size:17px;line-height:1.2}
.hdr .sub{display:block;font-weight:500;font-size:11.5px;color:#BDBDC0}
.hdr .ib{background:rgba(255,255,255,.1);border:0;color:#fff;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative}
.hdr .ib:active{background:rgba(255,255,255,.22)}
.hdr .pts{background:var(--red);border-radius:999px;padding:3px 11px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.staffbar{height:4px;background:linear-gradient(90deg,var(--red),var(--red-d))}
.dot{position:absolute;top:7px;left:7px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--hdr)}

/* ---- layout ---- */
#view{flex:1;padding:14px 14px calc(var(--tab) + 28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
#view.notab{padding-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.dark{background:var(--ink);color:#fff;border-color:#000}
.card.red{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;border:0}
.card h2,.h2{margin:0 0 6px;font-size:18px;font-weight:800;line-height:1.35}
.card h3,.h3{margin:0 0 4px;font-size:16px;font-weight:700}
.mut{color:var(--mut)}.sm{font-size:13.5px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{text-align:center}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
.sec-t{font-weight:800;font-size:15px;margin:4px 2px -4px;color:var(--mut);display:flex;align-items:center;gap:8px}
.sec-t:before{content:"";width:5px;height:16px;background:var(--red);border-radius:3px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;border:0;background:var(--red);color:#fff;font-weight:800;font-size:16.5px;cursor:pointer;width:100%;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.92)}
.btn[disabled],.btn.off{background:var(--soft);color:var(--mut);cursor:not-allowed;transform:none}
.btn.dk{background:var(--ink);color:#fff}
.btn.gh{background:transparent;color:var(--txt);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14.5px;width:auto;border-radius:11px}
.btn.xs{min-height:32px;padding:3px 11px;font-size:13px;width:auto;border-radius:9px}
.lnk{background:none;border:0;color:var(--red-d);font-weight:700;cursor:pointer;padding:6px 0;font-size:14.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft);color:var(--txt);white-space:nowrap;border:0}
.chip.red{background:var(--red);color:#fff}.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--red-d)}.chip.dk{background:var(--ink);color:#fff}
button.chip{cursor:pointer}button.chip.sel{background:var(--ink);color:#fff}

/* ---- sheet / toast ---- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:90;max-width:min(440px,92vw);pointer-events:none}
#toast div{background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-weight:700;font-size:14.5px;box-shadow:0 8px 28px rgba(0,0,0,.3);margin-bottom:8px;animation:tin .25s ease-out;border-right:5px solid var(--red)}
#toast div.ok{border-right-color:var(--ok)}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.pop{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:95;pointer-events:none;font-size:46px;font-weight:900;color:var(--red);text-shadow:0 2px 0 #fff,0 6px 24px rgba(234,35,41,.4);animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}25%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:94;overflow:hidden}
.conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.pop,.conf i,.sheet,#toast div{animation:none}}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:90px;border-radius:16px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ===== الملاحة «وصّلني» ===== */
.rt-go{min-height:84px;background:var(--ok);color:#fff;border:0;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:26px;box-shadow:0 10px 26px rgba(46,158,91,.35);margin-bottom:10px;margin-top:8px;text-align:right}
.rt-go b{display:block;font-size:28px;line-height:1.1}.rt-go small{display:block;font-size:13.5px;font-weight:700;opacity:.92;margin-top:3px}
.rt-go-ic{width:40px;height:40px;flex:none;transform:rotate(18deg)}
.rt-go-s{color:var(--ok)!important;font-weight:800;margin-inline-end:10px}
.nav{--nbg:#060A10;--nfg:#F5F8FB;--nmut:#93A0AE;--ncard:#101822;--nline:#223042;--ngo:#34D27B;--nmid:#FFB020;--nbad:#FF4D57;
  --mgo:#0B7A4B;--mgo2:#0FA463;--mmid:#A96500;--mbad:#B3202A;--minfo:#1D4E89;--mwait:#2A3A4D;
  position:fixed;inset:0;z-index:56;background:var(--nbg);color:var(--nfg);display:flex;flex-direction:column;gap:6px;overflow:hidden;overscroll-behavior:contain;
  padding:calc(6px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;color-scheme:dark}
.nav.day{--nbg:#EEF1F5;--nfg:#0A0D11;--nmut:#56606C;--ncard:#FFFFFF;--nline:#D3D9E0;--ngo:#0B8A42;--nmid:#A86400;--nbad:#C8102E;color-scheme:light}
.nav button,.nav a{font-family:inherit;-webkit-tap-highlight-color:transparent}
.nav-top{display:flex;align-items:center;gap:8px;min-height:50px}
.nav-x{flex:none;display:flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;border-radius:14px;border:1px solid var(--nline);background:var(--ncard);color:var(--nfg);font-size:14px;font-weight:800;cursor:pointer}
.nav-x .i{width:18px;height:18px}
.nav-to{flex:1;min-width:0;text-align:center}
.nav-lbl{font-size:12px;color:var(--nmut);font-weight:700;line-height:1.2}
.nav-to b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:18px;line-height:1.25;font-weight:900;overflow:hidden;text-wrap:balance}
.nav-step:has(#nv-step:empty):has(#nv-next[style*="none"]){display:none}
.nav-step{font-size:12px;color:var(--nmut);display:flex;gap:6px;justify-content:center;align-items:center;white-space:nowrap;overflow:hidden;line-height:1.5}
.nav-step span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nv-skip{flex:none;border:1px solid var(--nline);background:transparent;color:var(--nfg);border-radius:999px;font-size:11.5px;font-weight:800;padding:0 9px;cursor:pointer;line-height:1.7}
.nav-warnbar{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--ncard);border:1px solid var(--nmid);color:var(--nmid);border-radius:14px;padding:7px 12px;font-weight:800;font-size:13px}
.nav-wb{flex:none;border:0;border-radius:12px;background:var(--nmid);color:#000;font-weight:900;font-size:14px;padding:9px 12px;cursor:pointer}
/* كارت التوجيه: اللفة الجاية بخط كبير */
.nv-man{display:flex;align-items:center;gap:12px;border-radius:20px;padding:10px 14px;min-height:104px;background:var(--mgo);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.32);transition:background-color .3s,box-shadow .3s;flex:none}
.nv-man.soon{background:linear-gradient(135deg,var(--mgo2),var(--mgo));box-shadow:0 0 0 3px #fff inset,0 10px 28px rgba(0,0,0,.32)}
.nv-man.mid{background:var(--mmid)}.nv-man.bad{background:var(--mbad);animation:navpulse2 1s ease-in-out infinite}
.nv-man.info,.nv-man.free{background:var(--minfo)}.nv-man.wait{background:var(--mwait)}.nv-man.go,.nv-man.done{background-color:var(--mgo)}
.nv-mi{position:relative;width:76px;height:76px;flex:none}
.nv-mi .nav-arrow,.nv-mi .nv-gl{position:absolute;inset:0;color:#fff}
.nv-gl svg,.nav-arrow svg{width:100%;height:100%;display:block}
.nv-man.gl .nav-arrow{display:none}.nv-man.ar .nv-gl{display:none}.nv-man.wait .nav-arrow{opacity:.35}
.nav-arrow{transition:transform .45s ease-out;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.nav-arrow.bad{animation:navpulse 1s ease-in-out infinite}
.nv-mt{flex:1;min-width:0;display:flex;flex-direction:column}
#nv-mdist{font-size:clamp(34px,10.5vw,48px);line-height:1.02;font-weight:900;font-variant-numeric:tabular-nums;direction:rtl;letter-spacing:-.5px}
#nv-mdist:empty{display:none}
.nav-say{font-size:clamp(20px,6vw,27px);line-height:1.2;font-weight:900;text-wrap:balance;color:#fff}
.nv-msub{font-size:14px;font-weight:700;opacity:.93;line-height:1.35;margin-top:2px}
.nv-msub:empty{display:none}
.nv-msub .nav-wb{margin-top:6px}
.nv-then{display:flex;align-items:center;gap:6px;align-self:flex-start;margin:-8px 18px 0;background:var(--mgo);color:#fff;border-radius:0 0 14px 14px;padding:4px 12px 5px;font-size:13px;font-weight:800;flex:none}
.nv-then:empty{display:none}
.nv-then i{display:inline-flex;width:22px;height:22px}.nv-then i svg{width:100%;height:100%}
/* منظر القيادة */
.nv-stage{position:relative;flex:1 1 auto;min-height:170px;border-radius:20px;overflow:hidden;background:#03070D;border:1px solid var(--nline)}
.nav.day .nv-stage{background:#E4D3AE}
.nv-stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.nav-gps{position:absolute;top:8px;right:8px;max-width:calc(100% - 64px);font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(6,12,20,.8);color:#C9D3DE;line-height:1.5}
.nav-gps.go{color:#5BE39A}.nav-gps.mid{color:#FFC861}.nav-gps.bad{color:#FF7D84}
.nav.day .nav-gps{background:rgba(255,255,255,.92);color:#3A444F}.nav.day .nav-gps.go{color:#0B8A42}.nav.day .nav-gps.mid{color:#9A5A00}.nav.day .nav-gps.bad{color:#C8102E}
.nv-north{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;background:rgba(6,12,20,.8);border:1px solid rgba(255,255,255,.18)}
.nv-north i{position:absolute;top:2px;left:0;right:0;text-align:center;font-style:normal;font-weight:900;color:#FF4D57;font-size:13px;line-height:1}
.nv-north::after{content:'';position:absolute;left:calc(50% - 4px);top:16px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:12px solid #fff}
.nv-chip{position:absolute;top:40px;right:8px;max-width:calc(100% - 64px)}
.nvc{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(6,12,20,.8);line-height:1.5}
.nvc svg{width:14px;height:14px;flex:none}
.nvc.road{color:#7FE0AE}.nvc.join,.nvc.direct{color:#FFC861}
.nav.day .nvc{background:rgba(255,255,255,.92)}.nav.day .nvc.road{color:#0B7A4B}.nav.day .nvc.join,.nav.day .nvc.direct{color:#9A5A00}
.nv-far{position:absolute;left:10px;right:10px;top:72px;background:rgba(6,12,20,.93);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;line-height:1.5}
.nv-far:empty{display:none}
.nv-far b{font-size:15px}
.nv-farb{display:flex;align-items:center;justify-content:center;gap:6px;background:#1F6FFF;color:#fff;border-radius:12px;min-height:48px;font-weight:900;font-size:16px;text-decoration:none}
.nv-farb .i{width:18px;height:18px}
.nav-arrive{position:absolute;left:50%;top:46%;width:min(56%,210px);aspect-ratio:1;border-radius:50%;background:var(--ngo);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;padding:10%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.nav-arrive.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.nav-arrive svg{width:42%;height:auto}.nav-arrive b{font-size:28px;font-weight:900;line-height:1}.nav-arrive span{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.nv-fab{position:absolute;bottom:10px;display:flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:999px;border:0;font-weight:900;font-size:14.5px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.nv-fab .i{width:18px;height:18px;flex:none}
.nv-fab.lost{right:10px;background:#FFB020;color:#1A1200}
.nv-fab.view{left:10px;background:rgba(6,12,20,.85);color:#fff;border:1px solid rgba(255,255,255,.2)}
.nav.day .nv-fab.view{background:#fff;color:#0A0D11;border:1px solid #D3D9E0}
/* الباقي والوقت */
.nv-info{display:flex;flex-direction:column;gap:6px;flex:none}
.nv-rem{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.nv-rem>b{font-size:clamp(28px,8.5vw,38px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;direction:rtl}
.nv-eta{display:flex;flex-direction:column;font-size:13px;font-weight:800;color:var(--nmut);line-height:1.4}
.nv-eta span:empty{display:none}
.nv-eta .tr{display:inline-flex;align-items:center;gap:4px}.nv-eta .tr svg{width:15px;height:15px}
.nv-eta .tr.go{color:var(--ngo)}.nv-eta .tr.bad{color:var(--nbad)}
.nv-prog{height:6px;border-radius:99px;background:var(--nline);overflow:hidden}
.nv-prog i{display:block;height:100%;width:0;background:linear-gradient(270deg,var(--ngo),#5AA9FF);border-radius:inherit;transition:width .6s}
.nav-bar{display:flex;gap:8px;flex:none}
.nav-b{flex:1;min-width:0;min-height:58px;border-radius:18px;border:1px solid var(--nline);background:var(--ncard);color:var(--nfg);font-size:14.5px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 8px;text-align:center;line-height:1.2;text-decoration:none}
.nav-b .i{width:20px;height:20px;flex:none}
.nav-b.sos{flex:1.2;background:var(--nbad);border-color:var(--nbad);color:#fff;font-size:21px;letter-spacing:.5px}
@keyframes navpulse{50%{opacity:.45}}
@keyframes navpulse2{50%{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 10px 28px rgba(0,0,0,.32)}}
/* «أنا تايه» */
.lost-calm{display:flex;gap:10px;align-items:flex-start;background:var(--ok-bg);border-radius:14px;padding:12px;font-weight:700;font-size:14.5px;margin-bottom:10px;line-height:1.55}
.lost-calm .i{width:22px;height:22px;flex:none;color:var(--ok);margin-top:2px}
.lost-list{display:flex;flex-direction:column;gap:8px}
.lost-b{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);text-align:right;cursor:pointer;font-family:inherit;text-decoration:none}
.lost-b>svg{width:34px;height:34px;flex:none;color:var(--ok)}
.lost-b b{display:block;font-size:16.5px;font-weight:900;line-height:1.3}.lost-b small{display:block;font-size:13px;color:var(--mut);font-weight:700;line-height:1.4}
.lost-b.go{border:2px solid var(--ok)}
.lost-b.red{background:var(--red);border-color:var(--red);color:#fff}.lost-b.red>svg,.lost-b.red small{color:#fff}
.lost-b.dk{background:var(--ink);border-color:var(--ink);color:#fff}.lost-b.dk>svg,.lost-b.dk small{color:#fff}
.lost-ll{margin-top:12px;text-align:center;border:1px dashed var(--line);border-radius:14px;padding:10px}
.lost-ll b{display:block;font-size:22px;font-weight:900;letter-spacing:.5px;margin:4px 0 8px;font-variant-numeric:tabular-nums}
@media (max-height:700px){.nv-man{min-height:84px;padding:8px 12px}.nv-mi{width:60px;height:60px}#nv-mdist{font-size:32px}.nav-say{font-size:20px}.nav-b{min-height:50px}.nav-top{min-height:44px}.nav-to b{font-size:18px}.nv-rem>b{font-size:28px}}

/* ===== «وصّلني» — الشاشة الرئيسية (هوية «العدو غير المرئي»: أحمر #EA2329 / فحمي #242424) ===== */
body{background:var(--bg)}
.wsl{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.wh{position:relative;overflow:hidden;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px),radial-gradient(120% 90% at 100% 0,rgba(234,35,41,.45),transparent 60%),#1d1d1e;border-bottom:4px solid var(--red)}
.wh-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wh-top img{height:34px;width:auto}
.wh-tag{font-size:12.5px;font-weight:800;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:3px 12px;border-radius:999px}
.wh-ttl{display:flex;gap:12px;align-items:center;margin:14px 0 14px}
.wh-pin{flex:none;width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#F23C42,#B81E25);display:grid;place-items:center;box-shadow:0 10px 24px rgba(234,35,41,.45)}
.wh-pin svg{width:30px;height:30px;fill:#fff;stroke:#fff}
.wh h1{margin:0;font-size:34px;line-height:1.05;font-weight:900;letter-spacing:-.3px}
.wh p{margin:4px 0 0;font-size:13.5px;line-height:1.5;color:#D5D6D9;font-weight:700;text-wrap:balance}
.wh-search{display:flex;align-items:center;gap:8px;background:#fff;color:#242424;border-radius:16px;padding:0 14px;min-height:54px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.wh-search svg{color:var(--red)}
.wh-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16.5px;font-weight:700;min-height:52px;color:#242424}
.wv{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
.wv span,.wv-b{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.wv span.ok{color:var(--ok);border-color:rgba(46,158,91,.35)}
.wv-b{color:#fff;background:var(--ink);border-color:var(--ink);cursor:pointer;font-family:inherit}
.wm{flex:1;padding:12px 14px 20px;display:flex;flex-direction:column;gap:12px}
.w-near{background:var(--card);border:1.5px solid var(--red);border-radius:18px;padding:10px;box-shadow:0 10px 26px rgba(234,35,41,.12)}
.w-near-l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--red);margin:0 4px 6px}
.w-near-n{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;font-weight:700;color:var(--mut);margin:8px 4px 2px;line-height:1.5}
.w-near .wp{border:0;box-shadow:none;padding:6px 4px}
.wg{display:flex;flex-direction:column;gap:8px}
.wg-t{display:flex;align-items:center;gap:8px;margin:6px 2px 0;font-size:15px;font-weight:900;color:var(--txt)}
.wg-t:before{content:"";width:5px;height:17px;background:var(--red);border-radius:3px}
.wg-t span{font-size:12px;color:var(--mut);background:var(--soft);border-radius:999px;padding:0 8px;font-weight:800}
.wp{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-height:66px;cursor:pointer;font-family:inherit;color:var(--txt);box-shadow:var(--shadow)}
.wp:active{transform:scale(.99)}
.wp-ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.wp-ic.farm{background:#242424;color:#fff}.wp-ic.disinfect{background:var(--red);color:#fff}.wp-ic.service{background:#6D6E71;color:#fff}
.wp-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wp-t b{font-size:16px;font-weight:900;line-height:1.3}
.wp-t small{font-size:12.5px;color:var(--mut);font-weight:700}
.wp-road,.wp-stop{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:12px;font-weight:900;color:var(--ok);margin-top:2px}
.wp-stop{color:var(--red)}
.wp.stop{border-color:rgba(234,35,41,.5)}
.wp-d{flex:none;text-align:left}
.wp-d em{font-style:normal;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;color:var(--txt);direction:rtl;unicode-bidi:isolate}
.w-empty{text-align:center;color:var(--mut);font-weight:700;padding:30px 10px}
.wf{padding:14px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--mut);font-size:12.5px;font-weight:700;text-align:center}
.wf p{margin:10px 0 0}
.wf-who{display:flex;flex-direction:column;gap:6px;text-align:right}
.wf-who label{font-size:13px;font-weight:800;color:var(--txt)}.wf-who small{font-weight:700;color:var(--mut)}
.wf-who input{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:15px;font-weight:700}
/* ورقة المكان */
.wps{display:flex;flex-direction:column;gap:10px}
.wps-h{display:flex;gap:12px;align-items:center}
.wps-h h2{margin:0;font-size:20px;line-height:1.3;font-weight:900}
.wps-n{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.55;color:var(--txt)}
.wps-n b{display:block;font-size:14.5px;font-weight:900}
.wps-n svg{margin-top:3px;flex:none}
.wps-n.ok{background:var(--ok-bg)}.wps-n.ok svg{color:var(--ok)}
.wps-n.bad{background:var(--bad-bg)}.wps-n.bad svg{color:var(--red)}
.wps-n.bio svg{color:var(--red)}
.wps .btn svg{width:22px;height:22px}
.wk{display:flex;flex-direction:column;gap:10px;margin:4px 0 2px}
.wk-b{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--txt);text-align:right;cursor:pointer;font-family:inherit}
.wk-b .wk-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:22px;font-weight:900}
.wk-b.clean{border-color:#1d8a5a}.wk-b.clean .wk-ic{background:#1d8a5a;color:#fff}
.wk-b.dirty{border-color:#a8641a}.wk-b.dirty .wk-ic{background:#a8641a;color:#fff}
.wk-b b{display:block;font-size:17px;font-weight:900;line-height:1.3}.wk-b small{display:block;font-size:13px;color:var(--mut);font-weight:700;line-height:1.45}
.wk-b em{display:inline-block;font-style:normal;font-size:12px;font-weight:900;margin-top:3px;padding:1px 8px;border-radius:99px;background:var(--soft)}
.wk-b em.y{background:var(--ok-bg);color:var(--ok)}
.wp-k{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:3px}.wp-k i{font-style:normal;font-size:11.5px;font-weight:900;padding:1px 8px;border-radius:99px}
.wp-k .c{background:#e3f4ec;color:#1d8a5a}.wp-k .d{background:#f8ecdd;color:#a8641a}
.wps .btn[data-act="w_go"] svg{fill:#fff}
h2{font-size:20px}
/* ===== منظومة الأمن الحيوي: «وصّلني» جوه التطبيق (بيتضاف وقت البناء) ===== */
html.in-app body{background:var(--bg)}
html.in-app .wh-top{display:none}
html.in-app .wh-ttl{margin-top:4px}
@media (max-width:640px){html.in-app .wh p{display:none}html.in-app .wh h1{font-size:28px}html.in-app .wh-pin{width:48px;height:48px;border-radius:15px}html.in-app .wh-ttl{margin:4px 0 12px}}
/* الكمبيوتر: عرض كامل، الهيدر بعرض الصفحة، و«الأقرب ليك» ثابت على جنب والأماكن في شبكة */
@media (min-width:900px){
  html.in-app .wsl{max-width:none}
  html.in-app .wh{padding-left:max(24px,calc((100% - 1180px)/2));padding-right:max(24px,calc((100% - 1180px)/2))}
  html.in-app .wh-ttl{max-width:none}
  html.in-app .wh{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,520px);align-items:center;column-gap:28px}
  html.in-app .wh-ttl{margin:10px 0}
  html.in-app .wh-search{grid-column:2;grid-row:1}
  html.in-app .wh-ttl{grid-column:1;grid-row:1}
  html.in-app .wv{max-width:1180px;margin:0 auto;width:100%;padding-left:24px;padding-right:24px}
  html.in-app .wm{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start;max-width:1180px;margin:0 auto;width:100%;padding:16px 24px 28px}
  html.in-app #w_near{position:sticky;top:14px}
  html.in-app #w_near:empty{display:none}
  html.in-app #w_near:empty + #w_list{grid-column:1/-1}
  html.in-app #w_list{display:flex;flex-direction:column;gap:14px;min-width:0}
  html.in-app .wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  html.in-app .wg-t{grid-column:1/-1}
  html.in-app .nav{max-width:none;padding-left:max(16px,calc((100% - 760px)/2));padding-right:max(16px,calc((100% - 760px)/2))}
  html.in-app .ovl{align-items:center}
  html.in-app .sheet{width:min(560px,94%);border-radius:22px;max-height:86vh}
}

  /* ---------- قلب الملاحة: بيحسب «إنت فين من الطريق» واللفة الجاية ---------- */

/* ===== منظومة الأمن الحيوي: «محاكاة الطرق» جوه «وصّلني» (بيتضاف وقت البناء للنسخة اللي جوه التطبيق بس) =====
